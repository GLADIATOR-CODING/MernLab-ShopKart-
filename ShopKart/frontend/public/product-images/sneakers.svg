<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <pattern id="checkerboard" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#121212" opacity="0.08"/>
      <rect x="15" y="15" width="15" height="15" fill="#121212" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#F3F4F6"/>
  <rect width="600" height="400" fill="url(#checkerboard)"/>

  <!-- Top Badge -->
  <g transform="translate(450, 40)">
    <rect width="110" height="28" rx="4" fill="#121212"/>
    <text x="55" y="19" fill="#00F0FF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">CYBER KICKS</text>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="308" cy="338" rx="200" ry="24" fill="#121212" opacity="0.8"/>

  <!-- Sneaker Body Shadow -->
  <path d="M 128 298 L 128 258 Q 158 208 208 198 L 278 128 L 338 128 L 358 198 L 468 238 Q 488 278 458 298 Z" fill="#121212" transform="translate(8, 8)"/>

  <!-- Chunky Tread Platform Sole -->
  <!-- Sole Base Shadow -->
  <rect x="118" y="278" width="360" height="45" rx="10" fill="#121212"/>
  <!-- Sole Main (High-contrast Yellow) -->
  <rect x="110" y="270" width="360" height="45" rx="10" fill="#FFE600" stroke="#121212" stroke-width="6"/>
  <!-- Jagged Tread Cleats on Bottom -->
  <g fill="#121212">
    <polygon points="140,315 155,315 150,332 135,332"/>
    <polygon points="180,315 195,315 190,332 175,332"/>
    <polygon points="220,315 235,315 230,332 215,332"/>
    <polygon points="260,315 275,315 270,332 255,332"/>
    <polygon points="300,315 315,315 310,332 295,332"/>
    <polygon points="340,315 355,315 350,332 335,332"/>
    <polygon points="380,315 395,315 390,332 375,332"/>
    <polygon points="420,315 435,315 430,332 415,332"/>
  </g>

  <!-- Sneaker Upper Body (Cyan + White) -->
  <path d="M 120 270 L 120 220 Q 150 170 200 160 L 260 90 L 320 90 L 330 160 L 450 200 Q 470 240 450 270 Z" fill="#FFFFFF" stroke="#121212" stroke-width="6" stroke-linejoin="round"/>

  <!-- Toe Cap (Cyan) -->
  <path d="M 400 217 L 450 200 Q 470 240 450 270 L 390 270 Z" fill="#00F0FF" stroke="#121212" stroke-width="5"/>

  <!-- Cyberpunk Lightning Bolt Side Accent (Pink) -->
  <polygon points="210,210 280,180 250,225 320,195 240,265 260,230" fill="#FF5277" stroke="#121212" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ankle Collar Padding -->
  <path d="M 200 160 Q 230 140 260 90 L 290 90 Q 250 160 210 180 Z" fill="#121212"/>

  <!-- Heel Pull Tab (Yellow) -->
  <rect x="175" y="125" width="22" height="45" rx="4" fill="#FFE600" stroke="#121212" stroke-width="4"/>

  <!-- Neon Tubular Laces (Yellow) -->
  <g stroke="#FFE600" stroke-width="6" stroke-linecap="round">
    <line x1="280" y1="120" x2="330" y2="135"/>
    <line x1="300" y1="145" x2="350" y2="160"/>
    <line x1="320" y1="170" x2="370" y2="185"/>
  </g>
  <g stroke="#121212" stroke-width="2" stroke-linecap="round">
    <line x1="280" y1="120" x2="330" y2="135"/>
    <line x1="300" y1="145" x2="350" y2="160"/>
    <line x1="320" y1="170" x2="370" y2="185"/>
  </g>

  <!-- Eyelets -->
  <circle cx="280" cy="120" r="5" fill="#121212"/>
  <circle cx="300" cy="145" r="5" fill="#121212"/>
  <circle cx="320" cy="170" r="5" fill="#121212"/>

  <!-- Sparkles -->
  <path d="M 70 120 Q 80 130 80 140 Q 80 130 90 120 Q 80 110 80 100 Q 80 110 70 120 Z" fill="#121212"/>
</svg>
