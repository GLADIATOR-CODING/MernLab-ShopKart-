<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid-cam" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.5" fill="#121212" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#FFE600"/>
  <rect width="600" height="400" fill="url(#dot-grid-cam)"/>

  <!-- Top Badge -->
  <g transform="translate(40, 35)">
    <rect width="90" height="28" rx="4" fill="#121212"/>
    <text x="45" y="19" fill="#00F0FF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">35MM FILM</text>
  </g>

  <!-- Camera Body Shadow -->
  <rect x="138" y="118" width="340" height="200" rx="16" fill="#121212"/>
  <!-- Camera Body Main (Silver Top / Black Grip) -->
  <rect x="130" y="110" width="340" height="200" rx="16" fill="#FFFFFF" stroke="#121212" stroke-width="6"/>

  <!-- Leatherette Texture / Bottom Half -->
  <rect x="130" y="160" width="340" height="150" fill="#121212"/>

  <!-- Top Control Dials -->
  <!-- Left Dial -->
  <rect x="160" y="90" width="44" height="22" rx="4" fill="#00F0FF" stroke="#121212" stroke-width="4"/>
  <!-- Hotshoe (Flash mount) -->
  <rect x="280" y="94" width="40" height="18" rx="2" fill="#FFE600" stroke="#121212" stroke-width="4"/>
  <!-- Shutter Button (Red/Pink) -->
  <rect x="360" y="86" width="32" height="26" rx="4" fill="#FF5277" stroke="#121212" stroke-width="4"/>
  <!-- Right Winding Dial -->
  <rect x="410" y="92" width="36" height="20" rx="4" fill="#121212"/>

  <!-- Viewfinder Window -->
  <rect x="380" y="125" width="36" height="24" rx="4" fill="#00F0FF" stroke="#121212" stroke-width="4"/>
  <!-- Red Focus Assist Dot -->
  <circle cx="170" cy="135" r="8" fill="#FF5277" stroke="#121212" stroke-width="3"/>

  <!-- Big Lens Assembly Shadow -->
  <circle cx="288" cy="228" r="80" fill="#121212"/>
  <!-- Outer Barrel -->
  <circle cx="280" cy="220" r="80" fill="#E2E8F0" stroke="#121212" stroke-width="6"/>
  <!-- Aperture Ring -->
  <circle cx="280" cy="220" r="64" fill="#121212" stroke="#121212" stroke-width="4"/>
  <!-- Front Glass Element (Cyan) -->
  <circle cx="280" cy="220" r="50" fill="#00F0FF" stroke="#121212" stroke-width="4"/>
  <!-- Inner Glass Pupil -->
  <circle cx="280" cy="220" r="28" fill="#121212"/>

  <!-- Glass Arc Reflections -->
  <path d="M 255 195 A 35 35 0 0 1 305 195" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="300" cy="235" r="6" fill="#FFFFFF"/>

  <!-- Flash Beam Effect (Top Right) -->
  <path d="M 460 70 L 530 40 L 515 90 Z" fill="#FF5277" stroke="#121212" stroke-width="3"/>

  <!-- Sparkles -->
  <path d="M 70 240 Q 80 250 80 260 Q 80 250 90 240 Q 80 230 80 220 Q 80 230 70 240 Z" fill="#121212"/>
</svg>
