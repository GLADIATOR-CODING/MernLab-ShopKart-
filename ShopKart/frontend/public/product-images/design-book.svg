<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid-bk" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.5" fill="#121212" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#A3E635"/>
  <rect width="600" height="400" fill="url(#dot-grid-bk)"/>

  <!-- Top Badge -->
  <g transform="translate(450, 40)">
    <rect width="110" height="28" rx="4" fill="#121212"/>
    <text x="55" y="19" fill="#A3E635" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">1ST EDITION</text>
  </g>

  <!-- Hardcover Book (Isometric Perspective) -->
  <!-- Shadow -->
  <polygon points="178,338 418,338 458,98 218,98" fill="#121212"/>

  <!-- Book Block (Pages thickness) -->
  <polygon points="170,330 205,340 445,340 410,330" fill="#E2E8F0" stroke="#121212" stroke-width="5"/>
  <!-- Page line ridges -->
  <line x1="205" y1="334" x2="445" y2="334" stroke="#94A3B8" stroke-width="2"/>
  <line x1="205" y1="337" x2="445" y2="337" stroke="#94A3B8" stroke-width="2"/>

  <!-- Book Spine (Left) -->
  <polygon points="170,90 205,100 205,340 170,330" fill="#FFE600" stroke="#121212" stroke-width="5" stroke-linejoin="round"/>
  <!-- Spine Text -->
  <text x="-220" y="193" fill="#121212" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" transform="rotate(-90)" letter-spacing="3">DESIGN SYSTEMS // 2026</text>

  <!-- Book Front Cover -->
  <polygon points="205,100 445,100 445,340 205,340" fill="#FFFFFF" stroke="#121212" stroke-width="6" stroke-linejoin="round"/>

  <!-- Neo-Brutalist Bauhaus Cover Art on Book -->
  <!-- Giant Circle -->
  <circle cx="325" cy="180" r="50" fill="#FF5277" stroke="#121212" stroke-width="4"/>
  <!-- Giant Yellow Square -->
  <rect x="290" y="190" width="70" height="70" fill="#FFE600" stroke="#121212" stroke-width="4"/>
  <!-- Cyan Accent Bar -->
  <rect x="235" y="130" width="180" height="18" fill="#00F0FF" stroke="#121212" stroke-width="3"/>

  <!-- Book Title -->
  <text x="325" y="295" fill="#121212" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="1">SYSTEMS</text>
  <text x="325" y="315" fill="#121212" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="10" text-anchor="middle" letter-spacing="2">A BULLETPROOF GUIDE</text>

  <!-- Red Silk Bookmark Ribbon hanging out -->
  <polygon points="320,335 330,335 335,370 325,360 315,370" fill="#FF5277" stroke="#121212" stroke-width="3"/>
</svg>
