<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid-nb" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.5" fill="#121212" opacity="0.18"/>
    </pattern>
    <pattern id="paper-grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#4ADE80"/>
  <rect width="600" height="400" fill="url(#dot-grid-nb)"/>

  <!-- Top Badge -->
  <g transform="translate(40, 35)">
    <rect width="90" height="28" rx="4" fill="#121212"/>
    <text x="45" y="19" fill="#4ADE80" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">A5 // 160 PGS</text>
  </g>

  <!-- Notebook Shadow -->
  <rect x="178" y="78" width="260" height="280" rx="10" fill="#121212"/>
  <!-- Main Cover (Neon Yellow) -->
  <rect x="170" y="70" width="260" height="280" rx="10" fill="#FFE600" stroke="#121212" stroke-width="6"/>

  <!-- Open Page Reveal Area -->
  <rect x="220" y="90" width="190" height="240" rx="4" fill="#FFFFFF" stroke="#121212" stroke-width="4"/>
  <rect x="220" y="90" width="190" height="240" rx="4" fill="url(#paper-grid)"/>

  <!-- Wireframe Sketch Mockup on the page -->
  <rect x="240" y="110" width="150" height="24" rx="3" fill="#38BDF8" stroke="#121212" stroke-width="3"/>
  <rect x="240" y="146" width="68" height="70" rx="3" fill="#FF5277" stroke="#121212" stroke-width="3"/>
  <rect x="320" y="146" width="70" height="70" rx="3" fill="#4ADE80" stroke="#121212" stroke-width="3"/>
  <line x1="240" y1="234" x2="390" y2="234" stroke="#121212" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="240" y1="250" x2="340" y2="250" stroke="#121212" stroke-width="3"/>

  <!-- Spiral Rings (Left spine) -->
  <!-- Wire loops -->
  <g fill="#FFFFFF" stroke="#121212" stroke-width="4">
    <rect x="156" y="95" width="26" height="12" rx="6" />
    <rect x="156" y="125" width="26" height="12" rx="6" />
    <rect x="156" y="155" width="26" height="12" rx="6" />
    <rect x="156" y="185" width="26" height="12" rx="6" />
    <rect x="156" y="215" width="26" height="12" rx="6" />
    <rect x="156" y="245" width="26" height="12" rx="6" />
    <rect x="156" y="275" width="26" height="12" rx="6" />
    <rect x="156" y="305" width="26" height="12" rx="6" />
  </g>

  <!-- Yellow Carpenter Pencil with Shadow -->
  <!-- Pencil shadow -->
  <g transform="translate(388, 258) rotate(35)">
    <polygon points="0,0 200,0 200,22 0,22" fill="#121212"/>
    <polygon points="200,0 230,11 200,22" fill="#121212"/>
  </g>
  <!-- Pencil body -->
  <g transform="translate(380, 250) rotate(35)">
    <polygon points="0,0 200,0 200,22 0,22" fill="#FF5277" stroke="#121212" stroke-width="4"/>
    <line x1="0" y1="11" x2="200" y2="11" stroke="#121212" stroke-width="2"/>
    <!-- Wood tip -->
    <polygon points="200,0 230,11 200,22" fill="#FEF08A" stroke="#121212" stroke-width="4"/>
    <!-- Graphite lead -->
    <polygon points="220,7 230,11 220,15" fill="#121212"/>
    <!-- Eraser end -->
    <rect x="-16" y="0" width="16" height="22" rx="2" fill="#00F0FF" stroke="#121212" stroke-width="3"/>
  </g>
</svg>
