<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid-hp" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.5" fill="#121212" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#38BDF8"/>
  <rect width="600" height="400" fill="url(#dot-grid-hp)"/>

  <!-- Top Badge -->
  <g transform="translate(450, 40)">
    <rect width="110" height="28" rx="4" fill="#121212"/>
    <text x="55" y="19" fill="#FFE600" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">HI-RES AUDIO</text>
  </g>

  <!-- Sound Waves (Left) -->
  <path d="M 80 200 A 30 30 0 0 1 80 260" fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round"/>
  <path d="M 60 180 A 55 55 0 0 1 60 280" fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round"/>

  <!-- Sound Waves (Right) -->
  <path d="M 520 200 A 30 30 0 0 0 520 260" fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round"/>
  <path d="M 540 180 A 55 55 0 0 0 540 280" fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round"/>

  <!-- Headband Shadow -->
  <path d="M 168 238 C 168 118 438 118 438 238" fill="none" stroke="#121212" stroke-width="24" stroke-linecap="round"/>
  <!-- Headband Body -->
  <path d="M 160 230 C 160 110 430 110 430 230" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
  <path d="M 160 230 C 160 110 430 110 430 230" fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round"/>
  <!-- Top Headband Cushion Accent -->
  <path d="M 220 128 C 260 116 330 116 370 128" fill="none" stroke="#FFE600" stroke-width="12" stroke-linecap="round"/>

  <!-- Left Earcup Shadow -->
  <rect x="128" y="198" width="56" height="110" rx="28" fill="#121212"/>
  <!-- Left Earcup Outer -->
  <rect x="120" y="190" width="56" height="110" rx="28" fill="#121212" stroke="#121212" stroke-width="4"/>
  <!-- Left Earcup Cushion -->
  <rect x="156" y="200" width="22" height="90" rx="10" fill="#FF5277" stroke="#121212" stroke-width="3"/>
  <circle cx="140" cy="245" r="16" fill="#00F0FF" stroke="#121212" stroke-width="3"/>

  <!-- Right Earcup Shadow -->
  <rect x="424" y="198" width="56" height="110" rx="28" fill="#121212"/>
  <!-- Right Earcup Outer -->
  <rect x="416" y="190" width="56" height="110" rx="28" fill="#121212" stroke="#121212" stroke-width="4"/>
  <!-- Right Earcup Cushion -->
  <rect x="414" y="200" width="22" height="90" rx="10" fill="#FF5277" stroke="#121212" stroke-width="3"/>
  <circle cx="452" cy="245" r="16" fill="#00F0FF" stroke="#121212" stroke-width="3"/>

  <!-- Sparkle Accents -->
  <path d="M 290 280 Q 300 290 300 300 Q 300 290 310 280 Q 300 270 300 260 Q 300 270 290 280 Z" fill="#FFE600" stroke="#121212" stroke-width="2"/>
  <path d="M 290 280 Q 300 290 300 300 Q 300 290 310 280 Q 300 270 300 260 Q 300 270 290 280 Z" fill="#121212" transform="translate(10, 20)"/>
</svg>
