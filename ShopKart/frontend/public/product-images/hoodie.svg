<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid-hd" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.5" fill="#121212" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#FF6B8B"/>
  <rect width="600" height="400" fill="url(#dot-grid-hd)"/>

  <!-- Top Badge -->
  <g transform="translate(450, 40)">
    <rect width="110" height="28" rx="4" fill="#121212"/>
    <text x="55" y="19" fill="#FFE600" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">HEAVY FLEECE</text>
  </g>

  <!-- Hoodie Shadow -->
  <path d="M 228 108 L 138 168 L 178 228 L 208 208 L 208 348 L 398 348 L 398 208 L 428 228 L 468 168 L 378 108 Z" fill="#121212" transform="translate(8, 8)"/>

  <!-- Hoodie Main Body -->
  <path d="M 220 100 L 130 160 L 170 220 L 200 200 L 200 340 L 400 340 L 400 200 L 430 220 L 470 160 L 380 100 Z" fill="#FFFFFF" stroke="#121212" stroke-width="6" stroke-linejoin="round"/>

  <!-- Hood Shape (Back / Collar) -->
  <path d="M 240 105 Q 300 45 360 105 Q 300 135 240 105 Z" fill="#FFE600" stroke="#121212" stroke-width="5" stroke-linejoin="round"/>

  <!-- Chunky Braided White Drawstrings with Yellow Aglets -->
  <!-- Left drawstring -->
  <path d="M 270 125 Q 260 170 265 210" fill="none" stroke="#121212" stroke-width="5" stroke-linecap="round"/>
  <rect x="260" y="210" width="10" height="18" rx="2" fill="#00F0FF" stroke="#121212" stroke-width="3"/>
  <!-- Right drawstring -->
  <path d="M 330 125 Q 340 170 335 210" fill="none" stroke="#121212" stroke-width="5" stroke-linecap="round"/>
  <rect x="330" y="210" width="10" height="18" rx="2" fill="#00F0FF" stroke="#121212" stroke-width="3"/>

  <!-- Kangaroo Pouch Pocket with Shadow -->
  <polygon points="238,268 368,268 388,328 218,328" fill="#121212"/>
  <polygon points="230,260 360,260 380,320 210,320" fill="#00F0FF" stroke="#121212" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hand openings -->
  <line x1="230" y1="260" x2="210" y2="320" stroke="#121212" stroke-width="5"/>
  <line x1="360" y1="260" x2="380" y2="320" stroke="#121212" stroke-width="5"/>

  <!-- Embroidered Brutalist Chest Patch -->
  <rect x="265" y="150" width="70" height="36" rx="4" fill="#121212"/>
  <text x="300" y="172" fill="#FFE600" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1">404_LAB</text>

  <!-- Ribbed Hem -->
  <rect x="200" y="325" width="200" height="15" fill="#E2E8F0" stroke="#121212" stroke-width="4"/>
</svg>
