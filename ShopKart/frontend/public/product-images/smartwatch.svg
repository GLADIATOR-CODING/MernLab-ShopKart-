<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid-sw" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.5" fill="#121212" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#38BDF8"/>
  <rect width="600" height="400" fill="url(#dot-grid-sw)"/>

  <!-- Top Badge -->
  <g transform="translate(40, 35)">
    <rect width="100" height="28" rx="4" fill="#121212"/>
    <text x="50" y="19" fill="#00F0FF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">OLED RETINA</text>
  </g>

  <!-- Watch Straps (Vertical) -->
  <!-- Top Strap Shadow -->
  <rect x="256" y="28" width="94" height="90" rx="10" fill="#121212"/>
  <!-- Top Strap (Yellow with ribbed ribs) -->
  <rect x="248" y="20" width="94" height="90" rx="10" fill="#FFE600" stroke="#121212" stroke-width="6"/>
  <line x1="255" y1="45" x2="335" y2="45" stroke="#121212" stroke-width="4"/>
  <line x1="255" y1="65" x2="335" y2="65" stroke="#121212" stroke-width="4"/>
  <line x1="255" y1="85" x2="335" y2="85" stroke="#121212" stroke-width="4"/>

  <!-- Bottom Strap Shadow -->
  <rect x="256" y="278" width="94" height="100" rx="10" fill="#121212"/>
  <!-- Bottom Strap -->
  <rect x="248" y="270" width="94" height="100" rx="10" fill="#FFE600" stroke="#121212" stroke-width="6"/>
  <line x1="255" y1="295" x2="335" y2="295" stroke="#121212" stroke-width="4"/>
  <line x1="255" y1="315" x2="335" y2="315" stroke="#121212" stroke-width="4"/>
  <line x1="255" y1="335" x2="335" y2="335" stroke="#121212" stroke-width="4"/>

  <!-- Watch Body Shadow -->
  <rect x="218" y="108" width="160" height="180" rx="28" fill="#121212"/>
  <!-- Watch Body Case (White) -->
  <rect x="210" y="100" width="160" height="180" rx="28" fill="#FFFFFF" stroke="#121212" stroke-width="6"/>

  <!-- Digital Crown (Right knob) with Red accent ring -->
  <rect x="370" y="145" width="20" height="36" rx="6" fill="#121212"/>
  <rect x="372" y="153" width="8" height="20" rx="2" fill="#FF5277"/>

  <!-- Side Button (Right) -->
  <rect x="370" y="200" width="14" height="40" rx="4" fill="#00F0FF" stroke="#121212" stroke-width="3"/>

  <!-- Screen Bezel & Display (OLED Black) -->
  <rect x="226" y="116" width="128" height="148" rx="20" fill="#121212"/>

  <!-- Digital Clock UI -->
  <text x="290" y="170" fill="#00F0FF" font-family="'Space Grotesk', monospace" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="-1">10:42</text>
  <text x="290" y="195" fill="#FFE600" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" text-anchor="middle" letter-spacing="1">THU, OCT 24</text>

  <!-- Fitness UI: Heart rate & Steps -->
  <!-- Heart Icon + BPM -->
  <path d="M 245 224 A 6 6 0 0 1 257 224 Q 257 232 251 238 L 251 238 Q 245 232 245 224 Z" fill="#FF5277"/>
  <text x="264" y="235" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12">128</text>

  <!-- Battery / Step Indicator Bar -->
  <rect x="245" y="246" width="90" height="8" rx="4" fill="#334155"/>
  <rect x="245" y="246" width="65" height="8" rx="4" fill="#4ADE80"/>

  <!-- Sparkles -->
  <path d="M 460 210 Q 475 220 475 235 Q 475 220 490 210 Q 475 200 475 185 Q 475 200 460 210 Z" fill="#121212"/>
</svg>
